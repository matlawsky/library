name: Library CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: library
          POSTGRES_USER: library
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DJANGO_SETTINGS_MODULE: library.settings_test
      DATABASE_URL: postgres://library:ci-password@localhost:5432/library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt pip-audit
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py collectstatic --noinput
      - run: pip-audit -r requirements.lock
      - run: docker build -t library-ci .