{% extends '_base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container py-4"><h1>My account</h1>
<p>Email: {{ user.email }} · <a href="{% url 'account_email' %}">Manage verified email addresses</a></p>
<form method="post">{% csrf_token %}{{ form|crispy }}<button type="submit" class="btn btn-primary">Save profile</button></form>
<a href="{% url 'account_change_password' %}">Change password</a>
</div>{% endblock %}
